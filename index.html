    <!-- Early suppression of benign Vite HMR websocket disconnect notices -->
    <script>
      (function() {
        var isViteWsError = function(str) {
          if (!str) return false;
          str = String(str);
          return str.indexOf('WebSocket') !== -1 ||
                 str.indexOf('vite') !== -1 ||
                 str.indexOf('ws') !== -1 ||
                 str.indexOf('closed without opened') !== -1;
        };

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason ? (event.reason.message || event.reason) : '';
          if (isViteWsError(reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          var msg = event.message || (event.error && event.error.message) || '';
          if (isViteWsError(msg)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
    <!-- Professional Type Pairing: Plus Jakarta Sans for UI + JetBrains Mono for Hardware/EDA -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Google Identity Services client -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
